paths:
  /note/create:
    post:
      summary: 创建笔记
      deprecated: false
      description: ''
      tags: []
      parameters:
        - name: Content-Type
          in: header
          description: ''
          required: true
          example: application/json
          schema:
            type: string
        - name: Authorization
          in: header
          description: ''
          required: true
          example: '{{token}}'
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                videoId:
                  type: integer
                content:
                  type: string
                imageUrls:
                  type: array
                  items:
                    type: string
              required:
                - videoId
                - content
                - imageUrls
            example:
              video_id: 12
              content: 这是一条测试笔记
              imageUrls:
                - http://example.com/image1.jpg
                - http://example.com/image2.jpg
        required: true
      responses:
        '401':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
              example:
                code: '30000'
                message: authentication failure
          headers: {}
      security: []
