name: zitok
description: "ZiTok 短剧 — 竖屏连播短剧 App."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.5.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  video_player: ^2.9.1
  chewie: ^1.7.5
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  flutter_markdown: ^0.6.18
  file_picker: ^8.0.3
  go_router: ^14.2.0
  intl: ^0.19.0
  logger: ^2.2.0
  image_picker: ^1.2.0
  image_picker_for_web: ^3.0.2
  image: ^4.1.3
  crop_your_image: ^1.0.2
  path_provider: ^2.1.2
  crypto: ^3.0.3
  emoji_picker_flutter: ^4.4.0
  web_socket_channel: ^2.4.0
  screen_brightness: ^2.1.7
  lpinyin: ^2.0.3
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

  mockito: ^5.4.4 # 用于模拟依赖
  flutter_launcher_icons: ^0.14.4

# 规避 video_player_avfoundation 2.12.x 在当前 Xcode/Swift 下的 isolation 编译错误
dependency_overrides:
  video_player_avfoundation: 2.8.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#22C55E"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/profile_hero_bg.jpg
    - assets/icon/app_icon.png
