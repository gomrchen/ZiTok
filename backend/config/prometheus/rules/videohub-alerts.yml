groups:
  - name: videohub
    rules:
      # 服务不可用告警
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务 {{ $labels.job }} 不可用"
          description: "服务 {{ $labels.job }} 已经不可用超过1分钟"

      # 高错误率告警
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "服务 {{ $labels.job }} 错误率过高"
          description: "服务 {{ $labels.job }} 错误率超过5%"

      # 高响应时间告警
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "服务 {{ $labels.job }} 响应时间过长"
          description: "服务 {{ $labels.job }} 95%分位响应时间超过1秒"

      # Goroutines 过多告警
      - alert: TooManyGoroutines
        expr: go_goroutines > 5000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "服务 {{ $labels.job }} Goroutines 过多"
          description: "服务 {{ $labels.job }} 活跃 Goroutines 数量超过5000"

      # 内存使用过高告警
      - alert: HighMemoryUsage
        expr: go_memstats_heap_alloc_bytes / go_memstats_heap_sys_bytes > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "服务 {{ $labels.job }} 内存使用率过高"
          description: "服务 {{ $labels.job }} 堆内存使用率超过80%"

      # GC 频率过高告警
      - alert: HighGCFrequency
        expr: rate(go_gc_cycles_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "服务 {{ $labels.job }} GC 频率过高"
          description: "服务 {{ $labels.job }} GC 频率超过每秒10次" 