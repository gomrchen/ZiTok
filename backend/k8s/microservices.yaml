# Gateway 服务部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: videohub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      - name: init-storage
        image: busybox:1.35
        command: ["/bin/sh", "-c"]
        args:
        - |
          mkdir -p /app/src/storage/avatars
          mkdir -p /app/src/storage/videos
          mkdir -p /app/src/storage/covers
          mkdir -p /app/src/storage/chat
          chmod -R 755 /app/src/storage
        volumeMounts:
        - name: app-storage
          mountPath: /app/src/storage
      containers:
      - name: gateway
        image: videohub-gateway:latest
        imagePullPolicy: Never
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "ok" > /app/src/storage/health
          exec /app/output/gateway/videohub-gateway
        ports:
        - containerPort: 8080
        - containerPort: 6060  # pprof
        env:
        - name: ETCD_ADDR
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: ETCD_ADDR
        - name: MYSQL_ADDR
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: MYSQL_ADDR
        - name: REDIS_ADDR
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: REDIS_ADDR
        volumeMounts:
        - name: app-storage
          mountPath: /app/src/storage
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: app-storage
        hostPath:
          path: /tmp/videohub/storage
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: videohub
spec:
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 6060
    targetPort: 6060
    name: pprof
