# MySQL 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: videohub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        imagePullPolicy: Never
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: MYSQL_DATABASE
        - name: MYSQL_USER
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: MYSQL_PASSWORD
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: videohub
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
---
# Redis 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: videohub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:bookworm
        imagePullPolicy: Never
        ports:
        - containerPort: 6379
        command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: videohub
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
# ETCD 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: videohub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.5
        imagePullPolicy: Never
        ports:
        - containerPort: 2380
        - containerPort: 2381
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: ETCD_NAME
          value: "etcd-0"
        - name: ETCD_INITIAL_CLUSTER
          value: "etcd-0=http://$(POD_IP):2381"
        - name: ETCD_INITIAL_CLUSTER_STATE
          value: "new"
        - name: ETCD_INITIAL_CLUSTER_TOKEN
          value: "videohub-etcd"
        - name: ETCD_LISTEN_PEER_URLS
          value: "http://0.0.0.0:2381"
        - name: ETCD_LISTEN_CLIENT_URLS
          value: "http://0.0.0.0:2380"
        - name: ETCD_ADVERTISE_PEER_URLS
          value: "http://$(POD_IP):2381"
        - name: ETCD_ADVERTISE_CLIENT_URLS
          value: "http://$(POD_IP):2380"
        - name: ETCD_DATA_DIR
          value: "/etcd-data"
        volumeMounts:
        - name: etcd-data
          mountPath: /etcd-data
      volumes:
      - name: etcd-data
        persistentVolumeClaim:
          claimName: etcd-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: videohub
spec:
  selector:
    app: etcd
  ports:
  - port: 2380
    targetPort: 2380
    name: client
  - port: 2381
    targetPort: 2381
    name: peer
---
# Kafka 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: videohub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 0
        runAsUser: 0
        runAsGroup: 0
      initContainers:
      - name: init-kafka-data
        image: busybox:1.35
        imagePullPolicy: Never
        command: ['sh', '-c', 'mkdir -p /opt/bitnami/kafka/data && chown -R 1001:1001 /opt/bitnami/kafka/data']
        volumeMounts:
        - name: kafka-data
          mountPath: /opt/bitnami/kafka/data
          subPath: data
        securityContext:
          runAsUser: 0
      containers:
      - name: kafka
        image: bitnami/kafka:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 9092
        - containerPort: 9093
        env:
        - name: KAFKA_CFG_ZOOKEEPER_CONNECT
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: KAFKA_CFG_ZOOKEEPER_CONNECT
        - name: KAFKA_CFG_LISTENERS
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: KAFKA_CFG_LISTENERS
        - name: KAFKA_CFG_ADVERTISED_LISTENERS
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: KAFKA_CFG_ADVERTISED_LISTENERS
        - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
        - name: KAFKA_CFG_SASL_ENABLED_MECHANISMS
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: KAFKA_CFG_SASL_ENABLED_MECHANISMS
        - name: KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL
        - name: KAFKA_CFG_LISTENER_NAME_SASL_PLAINTEXT_PLAIN_SASL_JAAS_CONFIG
          valueFrom:
            configMapKeyRef:
              name: videohub-config
              key: KAFKA_CFG_LISTENER_NAME_SASL_PLAINTEXT_PLAIN_SASL_JAAS_CONFIG
        volumeMounts:
        - name: kafka-data
          mountPath: /opt/bitnami/kafka/data
      volumes:
      - name: kafka-data
        persistentVolumeClaim:
          claimName: kafka-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: videohub
spec:
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
    name: kafka
  - port: 9093
    targetPort: 9093
    name: kafka-internal
---
