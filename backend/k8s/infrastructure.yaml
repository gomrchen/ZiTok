# OpenTelemetry Collector 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: videohub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: docker.io/otel/opentelemetry-collector:latest
        imagePullPolicy: Never
        args: ["--config", "/etc/otel-collector-config.yaml"]
        ports:
        - containerPort: 4317  # OTLP gRPC receiver
        - containerPort: 4318  # OTLP http receiver
        - containerPort: 8888  # Prometheus metrics exposed by the collector
        - containerPort: 8889  # Prometheus exporter metrics
        volumeMounts:
        - name: otel-config
          mountPath: /etc/otel-collector-config.yaml
          subPath: otel-collector-config.yaml
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: otel-config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: videohub
spec:
  selector:
    app: otel-collector
  ports:
  - port: 4317
    targetPort: 4317
    name: otlp-grpc
  - port: 4318
    targetPort: 4318
    name: otlp-http
  - port: 8888
    targetPort: 8888
    name: metrics
  - port: 8889
    targetPort: 8889
    name: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: videohub
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024

    exporters:
      debug:
        verbosity: detailed
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: videohub
      otlp:
        endpoint: jaeger:4317
        tls:
          insecure: true

    extensions:
      health_check:
      pprof:
        endpoint: :1888
      zpages:
        endpoint: :55679

    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus, debug]
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp, debug] 
---
# Jaeger 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: videohub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:latest
        imagePullPolicy: Never
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        - name: COLLECTOR_OTLP_HTTP_PORT
          value: "4318"
        - name: COLLECTOR_OTLP_GRPC_PORT
          value: "4317"
        ports:
        - containerPort: 16686  # Jaeger UI
        - containerPort: 14250  # Jaeger gRPC receiver
        - containerPort: 14268  # Jaeger HTTP receiver
        - containerPort: 6831   # Jaeger UDP receiver
        - containerPort: 4317   # OTLP gRPC
        - containerPort: 4318   # OTLP HTTP
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: videohub
spec:
  selector:
    app: jaeger
  ports:
  - port: 16686
    targetPort: 16686
    name: ui
  - port: 14250
    targetPort: 14250
    name: grpc
  - port: 14268
    targetPort: 14268
    name: http
  - port: 6831
    targetPort: 6831
    name: udp
  - port: 4317
    targetPort: 4317
    name: otlp-grpc
  - port: 4318
    targetPort: 4318
    name: otlp-http 